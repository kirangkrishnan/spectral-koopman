[project]
name = "spectral-koopman"
version = "1.0.0"
description = "Spectrally consistent feedback-parameterized Koopman models with calibrated uncertainty"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.1", "scikit-learn>=1.3"]

[project.optional-dependencies]
double_pendulum = ["mujoco>=3.0"]
nmpc = ["casadi>=3.6"]
dev = ["pytest"]

[tool.setuptools]
packages = ["spectral_koopman"]

[tool.setuptools.package-data]
spectral_koopman = ["assets/*.xml"]
